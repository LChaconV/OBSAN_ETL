name: obsan-etl

x-app-base: &app-base
  image: obsan-etl:prod
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  env_file:
    - .env.production
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    PYTHONUNBUFFERED: "1"
    OBSAN_UPLOAD_LOG_LEVEL: DEBUG
    UV_NO_SYNC: "1"
    UV_PROJECT_ENVIRONMENT: /app/.venv
    UV_CACHE_DIR: /tmp/uv-cache
    PM2_HOME: /tmp/.pm2
    HOME: /tmp
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
  volumes:
    - obsan_data:/app/data
    - obsan_logs:/app/logs
    - obsan_state:/app/state
  tmpfs:
    - /tmp:size=1g,mode=1777
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  stop_grace_period: 60s

services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256m

  web:
    <<: *app-base
    ports:
      - "8501:8501"
    command:
      - uv
      - run
      - streamlit
      - run
      - apps/streamlit/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.maxUploadSize=300
      - --server.maxMessageSize=300
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: "1.0"
    mem_limit: 2g

  scheduler:
    <<: *app-base
    command:
      - pm2-runtime
      - ecosystem.config.js
      - --only
      - etl_scheduler
    cpus: "1.5"
    mem_limit: 2g

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    name: obsan_postgres_data
  obsan_data:
    name: obsan_app_data
  obsan_logs:
    name: obsan_app_logs
  obsan_state:
    name: obsan_app_state
